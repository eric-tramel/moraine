[workspace]
resolver = "2"
members = [
  "crates/moraine-config",
  "crates/moraine-clickhouse",
  "crates/moraine-conversations",
  "crates/moraine-ingest-core",
  "crates/moraine-mcp-core",
  "crates/moraine-monitor-core",
  "apps/moraine-ingest",
  "apps/moraine-mcp",
  "apps/moraine-monitor",
  "apps/moraine",
]
exclude = [
  "moraine-monitor/backend",
  "rust/codex-mcp",
  "rust/ingestor",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["Moraine Maintainers"]
